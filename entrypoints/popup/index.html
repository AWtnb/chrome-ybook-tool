<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Chrome YBook Tool</title>
    <link rel="stylesheet" href="https://unpkg.com/chota@latest" />
    <link rel="stylesheet" type="text/css" href="./style.css" />
  </head>

  <body>
    <div class="app">
      <div id="info-copy">
        <div class="box">
          <button disabled id="minimal-info" class="with-copy">Minimal</button>
        </div>
        <div class="box">
          <button disabled id="general-info" class="with-copy">Full</button>
        </div>
      </div>
      <div class="box">
        <label>①Slackに登録</label>
        <button disabled id="sheet-register">シートに登録</button>
      </div>
      <div class="box">
        <label>②Xに告知ツイート</label>
        <button disabled id="x-post-content" class="">投稿画面を開く</button>
      </div>
      <div class="box">
        <label>③インスタとFacebookに同時投稿</label>
        <button disabled id="meta-content" class="with-copy">
          文面をコピーして投稿画面を開く
        </button>
      </div>
      <div class="box">
        <label>④Threadsに投稿</label>
        <button disabled id="threads-content" class="">投稿画面を開く</button>
      </div>
      <hr />
      <div class="box juhan">
        <input type="number" value="2" min="2" id="juhan-count" disabled />
        <button
          disabled
          id="x-juhan-content"
          content=""
          juhan-count="2"
          class=""
        >
          Xに重版情報を投稿
        </button>
      </div>
      <div class="box">
        <button id="genpon" class="with-copy">
          原本カード掲載内容のコピー
        </button>
      </div>
      <div class="box">
        <button id="hasso" class="with-copy">発送依頼書内容のコピー</button>
      </div>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
